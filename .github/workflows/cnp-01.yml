name: CNP-01 Capability Native First
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
permissions:
  contents: read
jobs:
  governance-preflight:
    name: Capability-first proposal completeness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce LLM native-capability versus instrumental-runtime preflight
        run: node .github/scripts/check-capability-first.cjs
